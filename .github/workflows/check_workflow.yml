name: Check CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features

  test:
    name: cargo test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  engine-test:
    name: engine tests (vertex-jit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: cargo test (engine, debug)
        working-directory: engine
        run: cargo test --all-features
      - name: cargo test (engine, release — enforces the spec 2.1 T0 latency budget)
        working-directory: engine
        run: cargo test --release --all-features
      - name: cargo clippy (engine)
        working-directory: engine
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo doc (engine)
        working-directory: engine
        run: cargo doc --no-deps --document-private-items

  cep-lint:
    name: cep_lint self-verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: build (warnings as errors)
        run: tools/cep_lint/build.sh
      - name: self-test
        run: tools/cep_lint/build/cep_lint --self-test
      - name: self-lint gate
        run: tools/cep_lint/build/cep_lint tools/cep_lint/src
      - name: first-party scan (file_globs applicability - the Rust tree, DOC-SYNC included)
        run: tools/cep_lint/build/cep_lint
      - name: sanitizer self-test
        run: |
          MODE=asan tools/cep_lint/build.sh
          tools/cep_lint/build/cep_lint --self-test
          MODE= tools/cep_lint/build.sh
